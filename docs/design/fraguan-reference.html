function useProg(ref){const[p,s]=useState(0);useEffect(()=>{let t;const f=()=>{cancelAnimationFrame(t);t=requestAnimationFrame(()=>{if(!ref.current)return;const r=ref.current.getBoundingClientRect();s(Math.min(1,Math.max(0,-r.top/(r.height-innerHeight))))})};addEventListener('scroll',f,{passive:true});addEventListener('resize',f);f();return()=>{removeEventListener('scroll',f);removeEventListener('resize',f)}},[]);return p}

<button class="fv" aria-label="Favorito" onClick=${()=>tf(p.id)}>${f?'♥':'♡'}</button>${!p.img&&html`<span class="big d">${p.k}</span>`}
<div class="qa"><p>AGREGAR RÁPIDO · TALLE</p><div>${p.z.map(z=>html`<button key=${z} onClick=${()=>add(p,z,p.cols[0])}>${z}</button>`)}</div></div></div>

useEffect(()=>{const f=()=>{sh(location.hash||'#/');scrollTo(0,0);so(false)};addEventListener('hashchange',f);return()=>removeEventListener('hashchange',f)},[]);
useEffect(()=>ls.s('fg_cart',cart),[cart]);useEffect(()=>ls.s('fg_fav',favs),[favs]);useEffect(()=>ls.s('fg_me',user),[user]);useEffect(()=>ls.s('fg_orders',orders),[orders]);
const add=(p,s,col,q=1,op=true)=>{sc(a=>{const k=p.id+s+col,e=a.find(x=>x.k==k);return e?a.map(x=>x.k==k?{...x,q:x.q+q}:x):[...a,{k,id:p.id,n:p.n,p:p.p,s,col,q}]});if(op)so(true)};
const chg=(k,d)=>sc(a=>a.map(x=>x.k==k?{...x,q:x.q+d}:x).filter(x=>x.q>0)),rm=k=>sc(a=>a.filter(x=>x.k!=k)),tf=id=>sf(a=>a.includes(id)?a.filter(x=>x!=id):[...a,id]);
const reg=async(p,pw)=>{const U=ls.g('fg_users',{}),k=p.email.toLowerCase();if(U[k])return'Ya existe una cuenta con ese email.';U[k]={...p,h:await sha(pw)};ls.s('fg_users',U);su(p);return''};
const login=async(em,pw)=>{const U=ls.g('fg_users',{}),r=U[em.toLowerCase()];if(!r||r.h!=await sha(pw))return'Email o contraseña incorrectos.';const{h:_,...p}=r;su(p);return''};
const save=p=>{const U=ls.g('fg_users',{}),k=p.email.toLowerCase();if(U[k])U[k]={...U[k],...p};ls.s('fg_users',U);su(p)};
const saveOrder=x=>{sord(a=>[x,...a]);sc([])},n=cart.reduce((a,x)=>a+x.q,0),sub=cart.reduce((a,x)=>a+x.p*x.q,0);
const[a,b]=h.replace('#/','').split('/');
const pg=a==''?html`<${Home}/>`:a=='c'?html`<${Coll} c=${b||'todo'} key=${b}/>`:a=='p'?html`<${Prod} id=${+b} key=${b}/>`:a=='carrito'?html`<${CartPage}/>`:a=='checkout'?html`<${Check}/>`:a=='cuenta'?html`<${Acc} key=${user?'u':'g'}/>`:a=='gracias'?html`<${Thanks} id=${b}/>`:a=='favoritos'?html`<${Favs}/>`:a=='info'?html`<${Info} k=${b}/>`:html`<${NF}/>`;
const M='10% OFF PAGANDO POR TRANSFERENCIA',E='ENVÍOS A TODO EL PAÍS';
return html`<${C.Provider} value=${{cart,add,chg,rm,n,sub,favs,tf,user,reg,login,logout:()=>su(null),save,orders,saveOrder,so,news:[nw,()=>snw(true)]}}>
<div class="mq"><div>${[0,1,2,3,4,5].map(i=>html`<span key=${i}>${M} ✦ ${E} ✦</span>`)}</div></div>
<nav><a class="lg d" href="#/">Fraguan</a><div class="ln">${[['nuevos','Nuevos'],['camisas','Camisas'],['remeras','Remeras'],['pantalones','Pantalones'],['camperas','Abrigos']].map(([s,l])=>html`<a key=${s} href=${'#/c/'+s}>${l}</a>`)}</div><div class="nr"><a href="#/favoritos">♡ ${favs.length}</a><a href="#/cuenta">${user?user.nom:'Cuenta'}</a><button class="cb" onClick=${()=>so(true)}>CARRITO<i>${n}</i></button></div></nav>
<main>${pg}</main>
<footer><div class="fl"><div><b>AYUDA</b>${['envios','cambios','pagos','talles','contacto'].map(k=>html`<a key=${k} href=${'#/info/'+k}>${INFO[k][0]}</a>`)}<a href="#/cuenta">Mi cuenta</a></div><div><b>LEGAL</b>${['terminos','privacidad','cookies','arrepentimiento'].map(k=>html`<a key=${k} href=${'#/info/'+k}>${INFO[k][0]}</a>`)}</div></div><div class="wm d" aria-hidden="true">${'FRAGUAN'.split('').map((c,i)=>html`<span key=${i}>${c}</span>`)}</div></footer>
<${Cart} o=${o} close=${()=>so(false)}/><a class="wa" target="_blank" rel="noopener" href=${'https://wa.me/'+WAN}>WHATSAPP</a><${Cur}/><//>`}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script></body></html>
